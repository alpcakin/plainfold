<script type="text/plain" id="code-app/page.tsx">
"use client";
import { useEffect, useState } from "react";
import { BookCard } from "@/components/BookCard";
import type { Book } from "@/types/book";

export default function HomePage() {
  const [books, setBooks] = useState<Book[]>([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    fetch("/api/books?page=1")
      .then((res) => res.json())
      .then((json) => setBooks(json.books ?? []))
      .finally(() => setLoading(false));
  }, []);

  if (loading) return <p className="p-8 text-neutral-500">Loading your shelf…</p>;

  return (
    <main className="grid grid-cols-2 gap-4 p-8 md:grid-cols-4">
      {books.map((book) => (
        <BookCard key={book.id} book={book} />
      ))}
    </main>
  );
}
</script>
<script type="text/plain" id="code-app/books/new/page.tsx">
"use client";
import { useState } from "react";
import { useRouter } from "next/navigation";

export default function NewBookPage() {
  const router = useRouter();
  const [error, setError] = useState("");

  async function save(form: FormData) {
    const res = await fetch("/api/books", {
      method: "POST",
      body: JSON.stringify({
        title: form.get("title"),
        author: form.get("author"),
        isbn: form.get("isbn") || null,
      }),
    });
    if (!res.ok) {
      setError((await res.json()).error);
      return;
    }
    router.push("/");
  }

  return (
    <form action={save} className="grid gap-3 p-8">
      <input name="title" placeholder="Title" />
      <input name="author" placeholder="Author" />
      <input name="isbn" placeholder="ISBN (optional)" />
      {error && <p className="text-red-600">{error}</p>}
      <button type="submit">Save</button>
    </form>
  );
}
</script>
<script type="text/plain" id="code-components/BookCard.tsx">
import Link from "next/link";
import type { Book } from "@/types/book";

export function BookCard({ book }: { book: Book }) {

    <Link href={`/books/${book.id}`} className="rounded-xl border p-3 hover:shadow">
      {book.coverUrl ? (
        <img src={book.coverUrl} alt={book.title} className="aspect-[2/3] rounded-md" />

<script type="text/plain" id="code-app/api/books/route.ts">
import { NextResponse } from "next/server";
import { getCurrentUser } from "@/lib/auth";
import { supabase } from "@/lib/db";
import { coverUrlFor } from "@/lib/covers";
import type { Book } from "@/types/book";

const PAGE_SIZE = 20;

export async function GET(request: Request) {
  const user = await getCurrentUser();
  if (!user) {
    return NextResponse.json({ error: "Not logged in" }, { status: 401 });
  }

  const url = new URL(request.url);
  const page = Number(url.searchParams.get("page") ?? "1");
  const from = (page - 1) * PAGE_SIZE;

  const { data, error } = await supabase
    .from("books")
    .select("*")
    .eq("owner_id", user.id)
    .order("created_at", { ascending: false })
    .range(from, from + PAGE_SIZE - 1);

  if (error) {
    return NextResponse.json({ error: error.message }, { status: 500 });
  }

  const books: Book[] = data.map((book) => ({
    ...book,
    coverUrl: coverUrlFor(book.isbn),
  }));

  return NextResponse.json({ books, page });
}

export async function POST(request: Request) {
  const user = await getCurrentUser();
  if (!user) {
    return NextResponse.json({ error: "Not logged in" }, { status: 401 });
  }

  const body = await request.json();
  if (!body.title || !body.author) {
    return NextResponse.json({ error: "Title and author are required" }, { status: 400 });
  }

  const { data, error } = await supabase
    .from("books")
    .insert({
      title: body.title,
      author: body.author,
      isbn: body.isbn ?? null,
      owner_id: user.id,
    })
    .select()
    .single();

  if (error) {
    return NextResponse.json({ error: error.message }, { status: 500 });
  }

  return NextResponse.json({ book: data }, { status: 201 });
}
</script>
<script type="text/plain" id="code-lib/auth.ts">
import { cookies } from "next/headers";
import { supabase } from "@/lib/db";

export type User = { id: string; email: string };

export async function getCurrentUser(): Promise<User | null> {
  const token = (await cookies()).get("sb-access-token")?.value;
  if (!token) return null;

  const { data, error } = await supabase.auth.getUser(token);
  if (error || !data.user) return null;
  if (!data.user.email_confirmed_at) return null;

  return { id: data.user.id, email: data.user.email ?? "" };
}
</script>
<script type="text/plain" id="code-lib/covers.ts">
const COVERS_BASE = "https://covers.openlibrary.org/b/isbn";

export function coverUrlFor(isbn?: string | null): string | null {
  if (!isbn) return null;
  const clean = isbn.replace(/[^0-9X]/gi, "");
  if (clean.length !== 10 && clean.length !== 13) return null;
  return `${COVERS_BASE}/${clean}-M.jpg`;
}
</script>
<script type="text/plain" id="code-supabase/functions/cleanup-deleted/index.ts">
import { createClient } from "npm:@supabase/supabase-js@2";

Deno.serve(async () => {
  const supabase = createClient(
    Deno.env.get("SUPABASE_URL")!,
    Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!
  );

  const cutoff = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();
  const { data, error } = await supabase
    .from("books")
    .delete()
    .lt("deleted_at", cutoff)
    .select("id");

  if (error) return new Response(error.message, { status: 500 });

  await fetch(Deno.env.get("MAIL_API_URL")!, {
    method: "POST",
    body: JSON.stringify({ subject: "Nightly cleanup", removed: data.length }),
  });

  return new Response(JSON.stringify({ removed: data.length }));
});
</script>

        walk(it.items);

    const x = SETTINGS.find(z => z.id === sel.slice(2));

      <div class="kv"><div class="k">defined in</div><div>${esc(x.where)}</div><div class="k">used by</div><div>${esc(x.used)}</div>
      <div class="k">visibility</div><div class="${x.vis === 'public' ? 'vis-pub' : x.vis === 'secret' ? 'vis-sec' : ''}">${x.vis === 'public' ? 'visible in the browser' : x.vis === 'secret' ? 'secret' : esc(x.vis)}</div>
      <div class="k">note</div><div>${esc(x.note)}</div></div>${showCode([['', ref(x.code)]])}</div>`;
    return;
  }
  const intro = {runs:'Click a part to see what defines it. github actions opens the deploy pipeline.', ships:'Click a step to see what it does and the lines of the pipeline file behind it.',
    settings:'Click a setting to see where it is defined and what uses it.', built:'Everything here comes from package.json.', tools:'Nothing here changes what people see or what the app stores.'}[id];
  el.innerHTML = `<div class="pp"><h2><span class="hs">##</span>${esc(SETUP_VIEWS.find(x => x[0] === id)[1])}</h2><p class="lead">${esc(intro)}</p>
    ${id === 'ships' ? changeBlock(TRIGGER.chg, '1 h ago') + `<div class="acts"><button type="button" class="lk" data-act="rsel" data-id="trigger">› show me</button></div>` : ''}
    ${id === 'built' ? showCode([['', {file:'package.json', a:1, b:21}]]) : ''}</div>`;
}
function top() {
  const dark = document.documentElement.dataset.theme === 'dark';
  $('topr').innerHTML = `<span class="ok">● in sync</span><button type="button" class="chgc" data-act="showme">● getCurrentUser changed · 2 min</button><button type="button" class="chgc" data-act="view" data-id="setup:ships">● deploy pipeline changed · 1 h</button><button type="button" class="lk" data-act="theme">${dark ? 'light' : 'dark'}</button>`;
  $('foot').innerHTML = `<span>english by gemini 2.5 flash-lite · hosted</span><span>reads code only, never comments</span><span>esc closes details</span>`;
}
function render() { nav(); top(); center(); panel(); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const id = a.dataset.id, vid = view().id;
  switch (a.dataset.act) {
    case 'view': if (S.view !== id) { S.view = id; S.sel = null; S.code = false; S.toast = ''; } break;
    case 'toggle': S.exp[id] = !S.exp[id]; if (S.sel && S.sel.startsWith('p:') && P[S.sel.slice(2)].parent === id) S.sel = null; break;
    case 'part': S.sel = S.sel === 'p:' + id ? null : 'p:' + id; S.code = false; S.toast = ''; break;
    case 'sel': S.sel = S.sel === id ? null : id; S.code = false; S.toast = ''; break;
    case 'frame': S.open[id] = !S.open[id]; break;
    case 'code': S.code = !S.code; break;
    case 'showme': S.view = 'flow:home'; S.exp.server = true; S.sel = 'h4'; S.code = false; break;
    case 'expand-all': for (const g of FLOW[vid].top) if (P[g].group) S.exp[g] = true; (function w(items) { for (const it of items) if (it.t === 'frame') { S.open[it.id] = true; w(it.items); } })(FLOW[vid].items); break;
    case 'collapse-all': S.exp = {}; S.open = {}; S.sel = null; break;
    case 'rsel': { const pre = vid === 'runs' ? 'r:' : vid === 'ships' ? 'k:' : 'e:'; S.sel = S.sel === pre + id ? null : pre + id; S.code = false; break; }
    case 'gosetting': S.view = 'setup:settings'; S.sel = 'e:' + id; S.code = false; break;
    case 'confirm': S.confirmed[S.sel] = true; S.toast = ''; break;
    case 'unconfirm': delete S.confirmed[S.sel]; break;
    case 'hide': S.hidden[S.sel] = true; S.sel = null; break;
    case 'unhide': S.hidden = {}; break;
    case 'fix': {
      const text = BY_ID[S.sel].fix;
      const fail = () => { S.toast = 'copy didn’t work. the request: ' + text; panel(); };
      try { navigator.clipboard.writeText(text).then(() => { S.toast = 'copied. paste it into Claude Code'; panel(); }, fail); } catch (err) { fail(); }
      return;
    }
    case 'theme': {
      const dark = document.documentElement.dataset.theme !== 'dark';
      if (dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
      try { localStorage.setItem('plainfold-theme', dark ? 'dark' : 'light'); } catch (err) {}
      break;
    }
    default: return;
  }
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sel) { S.sel = null; S.code = false; render(); } });
window.addEventListener('resize', () => { if (view().k === 'flow') center(); });
render();
})();
</script>
