<meta name="viewport" content="width=device-width,initial-scale=1">
<title>plainfold skeleton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: the plainfold terminal page. Diagram in the middle, details on the right, findings under the diagram.
   Boxes only inside the diagram; hierarchy from weight, color, indentation and a few hairlines. */
:root{
  --bg:#fbfbfa; --fg:#1f2328; --fg-2:#59616b; --fg-3:#959ba3; --rule:#e6e7e9; --box:#f3f4f6; --box-line:#d6d9de;
  --frame:rgba(31,35,40,.028); --accent:#2f5ccc; --warn:#c2362b; --ok:#2e7d50; --hl:rgba(47,92,204,.10);
  --c-kw:#9a3fbf; --c-str:#2a7a3f; --c-num:#b5541a; --c-fn:#2c5fc4; --c-cm:#959ba3;
  --nest1:#f2f5fb; --nest2:#e9eef9; --nest3:#e0e7f6;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171b; --fg:#e4e6ea; --fg-2:#a7aeb7; --fg-3:#6b727c; --rule:#2a2e35; --box:#1f2228; --box-line:#363b45;
  --frame:rgba(255,255,255,.03); --accent:#8ea6ff; --warn:#f07b6f; --ok:#6cc18c; --hl:rgba(142,166,255,.13);
  --c-kw:#c792ea; --c-str:#a5d6a7; --c-num:#f0a46c; --c-fn:#82aaff; --c-cm:#6b727c; --nest1:#1a1e27; --nest2:#1e2330; --nest3:#232a3b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171b; --fg:#e4e6ea; --fg-2:#a7aeb7; --fg-3:#6b727c; --rule:#2a2e35; --box:#1f2228; --box-line:#363b45;
  --frame:rgba(255,255,255,.03); --accent:#8ea6ff; --warn:#f07b6f; --ok:#6cc18c; --hl:rgba(142,166,255,.13);
  --c-kw:#c792ea; --c-str:#a5d6a7; --c-num:#f0a46c; --c-fn:#82aaff; --c-cm:#6b727c; --nest1:#1a1e27; --nest2:#1e2330; --nest3:#232a3b; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.65 var(--mono);-webkit-font-smoothing:antialiased;padding-block:20px 40px;padding-inline:28px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:20px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.brand{font-weight:600}
.dim{color:var(--fg-3)}
.top .r{margin-left:auto;color:var(--fg-2)}
.main{display:grid;grid-template-columns:230px minmax(0,1fr) 340px;column-gap:32px;padding-top:22px;align-items:start}
.side{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;padding-right:18px;border-right:1px solid var(--rule)}
.side input{width:100%;font:inherit;font-size:12px;color:var(--fg);background:var(--box);border:1px solid var(--box-line);border-radius:3px;padding:4px 8px;letter-spacing:0}
.side input::placeholder{color:var(--fg-3)}
.side h4{margin:16px 0 4px;font-size:11.5px;font-weight:500;color:var(--fg-3);overflow-wrap:anywhere}
.side .none{color:var(--fg-3);font-size:12px;margin-top:12px}
.panel{position:sticky;top:20px;padding-left:28px;border-left:1px solid var(--rule);max-height:calc(100vh - 40px);overflow:auto}
.hs{color:var(--fg-3);font-weight:400;margin-right:10px}
h1{margin:0;font-size:16px;font-weight:600}
h2{margin:30px 0 8px;font-size:13.5px;font-weight:600}
.meta{margin-top:6px;color:var(--fg-2);font-size:12.5px}
.meta div{display:grid;grid-template-columns:84px minmax(0,1fr)}
.meta .k{color:var(--fg-3)}
.legend{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:11.5px;color:var(--fg-3);align-items:center}
.legend svg{vertical-align:middle;margin-right:6px}
.dia{overflow-x:auto;margin-top:6px;padding-bottom:6px}
svg.seq{display:block}
svg text{font-family:var(--mono)}
.grp line{stroke:var(--fg-3)}
.grp text{font-size:11.5px;fill:var(--fg-3)}
.pt{cursor:pointer}
.pt .bx{fill:var(--box);stroke:var(--box-line)}
.pt .lb{font-size:13px;font-weight:600;fill:var(--fg)}
.pt .sb{font-size:11px;fill:var(--fg-3)}
.pt:hover .bx,.pt.sel .bx{stroke:var(--accent)}
.pt:hover .lb,.pt.sel .lb{fill:var(--accent)}
.life{stroke:var(--rule);stroke-dasharray:2 4}
.num{font-size:11px;fill:var(--fg-3)}
.num.sub{fill:var(--accent)}
.nb{stroke:none}
.nbar{stroke:var(--accent);stroke-width:2;opacity:.45;stroke-linecap:butt}
.nbar.sel{opacity:1;stroke-width:3}
.ncap{stroke:var(--accent);stroke-width:1;opacity:.45}
.it{cursor:pointer}
.it .hit{fill:none;stroke:transparent;stroke-width:18}
.it .fold{fill:var(--accent);font-weight:600}
.it .tag{fill:var(--fg-3)}
.it.exit text{font-size:11.5px;fill:var(--fg-2)}
.it.exit .cond{fill:var(--fg-3)}
.it.exit .ln{stroke:var(--fg-3);stroke-dasharray:3 3}
.it .ln{fill:none;stroke:var(--fg-2);stroke-width:1.3}
.it.ret .ln{stroke:var(--fg-3);stroke-width:1}
.it.inf .ln{stroke-dasharray:5 4}
.it .ah{fill:var(--fg-2)}
.it text{font-size:12.5px;fill:var(--fg);paint-order:stroke;stroke:var(--halo,var(--bg));stroke-width:6px;stroke-linejoin:round}
.it.ret text{fill:var(--fg-2)}
.it .kd{fill:var(--fg-3)}
.it .rk{fill:var(--warn)}
.it.local text,.it.pure text{fill:var(--fg-2)}
.it:hover .ln,.it.sel .ln{stroke:var(--accent)}
.it:hover .ah,.it.sel .ah{fill:var(--accent)}
.it:hover text,.it.sel text{fill:var(--accent)}
.fr .bx{fill:var(--frame);stroke:var(--rule)}
.fr .sep{stroke:var(--rule);stroke-dasharray:4 3}
.fr text{font-size:11.5px;fill:var(--fg-2)}
.fr .kw{fill:var(--fg);font-weight:600}
.fr .nt{fill:var(--fg-3)}
.fr{cursor:pointer}
.fr:hover .bx,.fr.sel .bx{stroke:var(--accent)}
.fr:hover .lbl,.fr.sel .lbl{fill:var(--accent)}
.dv{cursor:pointer}
.dv line{stroke:var(--rule)}
.dv text{font-size:11.5px;fill:var(--fg-3)}
.dv:hover text,.dv.sel text{fill:var(--accent)}
.stories{display:flex;flex-direction:column;gap:1px}
.stories button{color:var(--fg-2);display:grid;grid-template-columns:12px minmax(0,1fr);padding:3px 0;width:100%;line-height:1.4;font-size:12.5px}
.stories button .mk{color:var(--accent)}
.stories button .t{overflow-wrap:anywhere}
.stories button.on{color:var(--fg);font-weight:600}
.stories button:hover .t{text-decoration:underline;text-underline-offset:3px}
.stories .fx{display:block;font-size:11px;color:var(--fg-3);font-weight:400}
.stories .fx.w{color:var(--warn)}
.it .cond{fill:var(--fg-3)}
.it .en{font-style:normal}
.tb{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px 16px}
.tb button{color:var(--accent)}
.tb button:hover{text-decoration:underline;text-underline-offset:3px}
.inside{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--fg-2)}
.inside li{padding:1px 0;overflow-wrap:anywhere}
.pbtn{color:var(--accent);margin-top:10px;font-size:12.5px}
.pbtn:hover{text-decoration:underline;text-underline-offset:3px}
.list{margin:0;padding:0;list-style:none}
.list li{padding:3px 0;display:grid;grid-template-columns:18px minmax(0,1fr);color:var(--fg-2)}
.list li::before{content:"-";color:var(--fg-3)}
.list.warn li::before{content:"!";color:var(--warn)}
.list button{display:inline;color:var(--accent)}
.list button:hover{text-decoration:underline;text-underline-offset:3px}
.cov{display:flex;flex-wrap:wrap;gap:4px 28px;color:var(--fg-2)}
.cov .ok{color:var(--ok)}
details summary{cursor:pointer;color:var(--accent)}
pre.json{font-size:11.5px;line-height:1.55;overflow:auto;max-height:520px;color:var(--fg-2);margin:10px 0 0}
.pp h3{margin:0;font-size:14px;font-weight:600;color:var(--accent);overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:84px minmax(0,1fr);column-gap:12px;margin-top:12px;font-size:12.5px}
.kv > div{padding:2px 0;overflow-wrap:anywhere}
.kv .k{color:var(--fg-3)}
.kv .exact{color:var(--ok)}
.kv .inferred{color:var(--warn)}
.cfile{margin:16px 0 4px;color:var(--fg-3);font-size:12px}
.code{font-size:12px;line-height:1.7;overflow-x:auto}
.code-in{display:inline-block;min-width:100%}
.cl{display:flex;white-space:pre;padding-right:8px}
.ct{white-space:pre} /* own flex item: flex containers drop whitespace-only text between spans */
.cn{flex:none;width:30px;padding-right:12px;text-align:right;color:var(--fg-3);user-select:none}
.cl.hl{background:var(--hl)}
.cl.hl .cn{color:var(--accent)}
.c-kw{color:var(--c-kw)} .c-str{color:var(--c-str)} .c-num{color:var(--c-num)} .c-fn{color:var(--c-fn)} .c-cm{color:var(--c-cm);font-style:italic}
.hint{color:var(--fg-3);font-size:12px;margin-top:14px}
@media (max-width: 980px){
  body{padding-inline:16px}
  .main{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;border-right:0;padding-right:0;border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:18px}
  .panel{position:static;max-height:none;overflow:visible;border-left:0;padding-left:0;border-top:1px solid var(--rule);padding-top:18px;margin-top:24px}
  .top .r{margin-left:0}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="top">
  <span class="brand">plainfold</span><span class="dim" id="proj"></span>
  <span class="r">skeleton only · no LLM · every label is code text</span>
</div>
<div class="main">
  <aside class="side" aria-label="Flows">
    <input id="q" type="search" placeholder="filter flows" aria-label="Filter flows" autocomplete="off">
    <nav class="stories" id="stories" aria-label="Flows"></nav>
  </aside>
  <section aria-label="Story">
    <h1><span class="hs">#</span><span id="title"></span></h1>
    <div class="meta" id="meta"></div>
    <div class="legend" id="legend"></div>
    <div class="dia" id="dia"></div>
    <h2><span class="hs">##</span>what the code shows</h2>
    <ul class="list warn" id="signals"></ul>
    <h2><span class="hs">##</span>not resolved yet</h2>
    <ul class="list" id="gaps"></ul>
    <h2><span class="hs">##</span>every line behind a step</h2>
    <div class="cov" id="cov"></div>
    <h2><span class="hs">##</span>the model</h2>
    <details><summary>show this story's model as JSON</summary><pre class="json" id="json"></pre></details>
  </section>
  <aside class="panel" id="panel" aria-label="Details"></aside>
</div>

<script type="application/json" id="model">/*MODEL*/</script>
<script type="application/json" id="labels">/*LABELS*/</script>
<script>
(() => {
'use strict';
const M = JSON.parse(document.getElementById('model').textContent);
const FILES = M.files;
document.getElementById('proj').textContent = M.name;
const L = JSON.parse(document.getElementById('labels').textContent);
const hasEn = Object.keys(L).length > 0;
let en = hasEn;
const lab = (it) => (en && L[`${it.t}|${it.ref.file}:${it.ref.from}`]) || null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tw = (s, size = 12.5) => String(s).length * size * 0.6; // Geist Mono advance is 0.6em
const TOP = 98;

// ---------- per-story state ----------
let S, P, PI, BY, allCalls, findings;
const open = new Set(), exitsOpen = new Set();
let every = false, ops = [], sel = null, zoom = null, zNow = 1; // zoom null = fit the width
const pname = (id) => PI[id]?.name ?? id;
const walk = (items, f) => { for (const it of items) { f(it); if (it.t === 'frame') { walk(it.items, f); walk(it.else || [], f); } if (it.t === 'call' && it.body) walk(it.body, f); } };
const effectsOf = (s) => { const e = new Set(); walk(s.items, (i) => { if (i.t === 'call' && i.effect) e.add(i.effect); }); return e; };

function load(story) {
  S = story; P = S.participants; PI = Object.fromEntries(P.map((p) => [p.id, p]));
  BY = {}; walk(S.items, (i) => { BY[i.id] = i; });
  allCalls = Object.values(BY).filter((i) => i.t === 'call' && i.body);
  allCalls.forEach((c) => { if (c.from === c.to) c.lane = true; });
  open.clear(); exitsOpen.clear();
  // the screen's own calls start open, everything deeper starts closed
  (function d(items) { for (const it of items) { if (it.t === 'call' && it.body && it.from !== it.to) open.add(it.id); if (it.t === 'frame') { d(it.items); d(it.else || []); } } })(S.items);
  sel = (Object.values(BY).find((i) => i.t === 'call') || S.items[0]).id;
  try { history.replaceState(null, '', '#' + M.stories.indexOf(S)); } catch (e) {}

  side();
  $('title').textContent = flowName(S).main + (flowName(S).sub ? ' · ' + flowName(S).sub : '');
  const count = (t) => Object.values(BY).filter((i) => i.t === t).length;
  const fxp = {};
  walk(S.items, (i) => { if (i.t === 'call' && i.effect) (fxp[i.to] = fxp[i.to] || new Set()).add(i.effect); });
  const touches = P.filter((p) => p.group === 'supabase' || p.group === 'outside').map((p) => p.name + (p.sub ? ` (${p.sub}${fxp[p.id] ? ' · ' + [...fxp[p.id]].join(', ') : ''})` : ''));
  const tr = S.trigger;
  $('meta').innerHTML = [
    ['trigger', tr.kind === 'screen-open' ? `screen opens · ${tr.route} · ${tr.ref.file}` : `user action · ${tr.route} · ${tr.ref.file}:${tr.ref.from}`],
    ['touches', touches.join(' · ') || 'nothing outside the app'],
    ['built', `${P.length} participants · ${count('call')} calls · ${count('return')} returns · ${M.stats.llmCalls} LLM calls · ${M.stories.length} stories in ${M.stats.ms} ms`],
  ].map(([k, v]) => `<div><span class="k">${k}</span><span>${esc(v)}</span></div>`).join('');

  findings = [];
  const fItem = (f, kind) => { findings.push({ ...f, kind }); return findings.length - 1; };
  const at = (r) => `${r.file}:${r.from}${r.to !== r.from ? '-' + r.to : ''}`;
  $('signals').innerHTML = S.signals.map((f) => `<li><span>${esc(f.text)} · <button type="button" data-f="${fItem(f, 'signal')}">${esc(at(f.ref))}</button></span></li>`).join('') || '<li>nothing</li>';
  $('gaps').innerHTML = S.gaps.map((f) => `<li><span>${esc(f.text)}${FILES[f.ref.file] ? ` · <button type="button" data-f="${fItem(f, 'gap')}">${esc(at(f.ref))}</button>` : ''}</span></li>`).join('') || '<li>nothing</li>';
  $('cov').innerHTML = S.coverage.map((c) => `<span>${esc(c.fn)} <span class="${c.missing.length ? '' : 'ok'}">${c.covered}/${c.total}</span>${c.missing.length ? ` <span class="dim">missing ${c.missing.join(', ')}</span>` : ''}</span>`).join('');
  $('json').textContent = JSON.stringify(S, null, 2);
  render();
}

// ---------- readable flow names ----------
// What a person would call the flow: the words on the control, else the handler's name in plain words, else the event.
const words = (name) => name.replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/[_-]+/g, ' ').trim().split(/\s+/).filter((w, i) => !(i === 0 && /^(handle|handler|on)$/i.test(w))).join(' ').toLowerCase();
const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
function flowName(st) {
  const t = st.trigger;
  if (t.kind !== 'user-action' || (!t.text && !t.handler && !t.event)) return { main: st.title, sub: '' };
  const main = t.text ? `“${t.text}”` : t.handler && words(t.handler) ? cap(words(t.handler)) : cap(t.event ? words(t.event) : 'action');
  return { main, sub: [t.event && words(t.event), t.control && `on ${t.control}`].filter(Boolean).join(' ') };
}

// ---------- flow list: grouped by the screen they belong to ----------
function side() {
  const q = $('q').value.trim().toLowerCase();
  const groups = new Map();
  M.stories.forEach((st, i) => {
    if (q && !(st.title + ' ' + flowName(st).main + ' ' + st.trigger.route).toLowerCase().includes(q)) return;
    if (!groups.has(st.trigger.route)) groups.set(st.trigger.route, []);
    groups.get(st.trigger.route).push([st, i]);
  });
  $('stories').innerHTML = [...groups].map(([route, list]) => `<h4>${esc(route)}</h4>` + list.map(([st, i]) => {
    const fx = [...effectsOf(st)], nm = flowName(st);
    return `<button type="button" class="${st === S ? 'on' : ''}" data-act="story" data-id="${i}"><span class="mk">${st === S ? '›' : ''}</span><span><span class="t">${esc(nm.main)}</span>` +
      (nm.sub ? `<span class="fx">${esc(nm.sub)}</span>` : '') +
      (fx.length ? `<span class="fx${fx.some((f) => f !== 'reads') ? ' w' : ''}">${esc(fx.join(', '))}</span>` : '') + `</span></button>`;
  }).join('')).join('') || '<div class="none">no flow matches</div>';
  const on = $('stories').querySelector('.on');
  const box = document.querySelector('.side'); // scroll only the list, not the page
  if (on) box.scrollTop = Math.max(0, on.offsetTop - box.clientHeight / 2);
}

// ---------- what is visible ----------
const isExit = (f) => f.t === 'frame' && f.kind === 'alt' && !f.else && f.items.some((i) => i.t === 'return') && f.items.every((i) => i.t === 'return' || (i.t === 'self' && i.kind === 'local'));
const code3 = (l) => (/^(\d{3}|redirect)\b/.exec(l) || [l])[0];
const orTag = (exits) => { const u = [...new Set(exits.map((e) => code3(e.label)))]; return u.length ? 'or ' + u.join(', ') : ''; };
// The callee's own returns: the main one (outside any branch) and the early exits.
function returnsOf(body, callee) {
  let main = null; const exits = [];
  (function w(items, inExit) {
    for (const i of items) {
      if (i.t === 'return' && i.from === callee) { if (inExit) exits.push(i); else main = i; }
      else if (i.t === 'frame') { const ex = inExit || isExit(i); w(i.items, ex); w(i.else || [], ex); }
    }
  })(body, false);
  return { main, exits };
}
const shortArgs = (l) => l.replace(/\((.{11,})\)$/, '(…)');

// A call to a plain function in the same process that touches nothing outside (no body, no effect), together with its return,
// folds into one row on the caller: "name(args) → result". Only when everything between the two belongs to the callee.
const ownedBy = (i, id) => (i.t === 'self' ? i.at === id : i.t === 'return' ? i.from === id : i.t === 'call' ? i.from === id : i.t === 'frame' ? i.items.every((x) => ownedBy(x, id)) && (i.else || []).every((x) => ownedBy(x, id)) : false);
function plainCall(items, idx) {
  const c = items[idx];
  if (every || c.t !== 'call' || c.body || c.effect || c.table || c.from === c.to) return null;
  const to = PI[c.to], from = PI[c.from];
  if (!to || !from || to.kind !== 'function' || to.group !== from.group) return null;
  for (let j = idx + 1; j < items.length; j++) {
    const x = items[j];
    if (x.t === 'return' && x.from === c.to && x.to === c.from) return { ret: x, next: j };
    if (!ownedBy(x, c.to)) return null;
  }
  return null;
}

function vis(items, scope, depth = 0, par = null) {
  const out = [];
  for (let idx = 0; idx < items.length; idx++) {
    const it = items[idx];
    const pc = plainCall(items, idx);
    if (pc) {
      out.push({ type: 'self', it: { t: 'self', id: it.id, at: it.from, kind: 'pure', label: it.label, ref: it.ref }, merged: [it], text: `${it.label} → ${pc.ret.label}` });
      idx = pc.next;
      continue;
    }
    if (it.t === 'self') {
      if (!every && (it.kind === 'local' || (it.kind === 'state' && (it.label.startsWith('useState:') || (scope && scope.lane))))) continue;
      const prev = out[out.length - 1];
      if (!every && it.kind === 'state' && prev && prev.type === 'self' && prev.it.kind === 'state' && !prev.cond) { prev.merged.push(it); continue; }
      out.push({ type: 'self', it, merged: [it] });
    } else if (it.t === 'call') {
      out.push({ type: 'msg', it, fold: it.body ? (open.has(it.id) ? '▾' : '▸') : '' });
      if (!it.body) continue;
      const r = returnsOf(it.body, it.to);
      const lane = it.from === it.to;
      if (open.has(it.id)) out.push(...vis(it.body, { callId: it.id, lane: lane || (scope && scope.lane), ...r }, depth + 1, it.id));
      else if (lane) {
        // closed: one arrow from the screen to what the hook goes on to touch ("reads splits, expenses")
        const targets = new Set();
        walk(it.body, (i) => { if (i.t === 'call' && i.table) targets.add(i.to); });
        if (targets.size === 1) {

      h += `<button type="button" class="pbtn" data-act="toggle" data-id="${it.id}">${open.has(it.id) ? '▾ close in the diagram' : '▸ open in the diagram'}</button>`;
    }
    if (it.opens) {
      const i = M.stories.findIndex((s) => s.id === 'open:' + it.opens);
      if (i >= 0) h += `<button type="button" class="pbtn" data-act="story" data-id="${i}">› this starts the story “${esc(M.stories[i].title)}”</button>`;
    }
    h += code(it.ref, 2);
    if (it.target) h += code(it.target, 0, 40, `goes to ${it.target.file} · ${it.target.from === it.target.to ? 'line ' + it.target.from : 'lines ' + it.target.from + '-' + it.target.to} (the definition)`);
  }
  $('panel').innerHTML = h + `<p class="hint">Click an arrow with ▸ to open what happens inside. Click anything to see the lines behind it.</p>`;
}

// ---------- interaction ----------
function act(o) {
  if (o.type === 'msg' && o.it.t === 'call' && o.it.body) { open.has(o.it.id) ? open.delete(o.it.id) : open.add(o.it.id); sel = o.it.id; }
  else if (o.synth) { open.add(o.synth.id); sel = o.synth.id; }
  else if (o.exitsOf) { exitsOpen.has(o.exitsOf) ? exitsOpen.delete(o.exitsOf) : exitsOpen.add(o.exitsOf); sel = o.it.id; }
  else sel = o.it.id;
  render();
}
function render() { draw(); toolbar(); panel(); }
function handle(t) {
  if (t.dataset.k) return act(ops[+t.dataset.k]);
  if (t.dataset.p) { sel = 'p:' + t.dataset.p; return render(); }
  if (t.dataset.f) { sel = 'f:' + t.dataset.f; return render(); }
  const a = t.dataset.act;
  if (a === 'story') return load(M.stories[+t.dataset.id]);
  if (a === 'all') { allCalls.forEach((c) => { open.add(c.id); exitsOpen.add(c.id); }); }
  else if (a === 'none') { open.clear(); exitsOpen.clear(); }
  else if (a === 'zout') zoom = Math.max(0.3, Math.round((zNow - 0.15) * 100) / 100);
  else if (a === 'zin') zoom = Math.min(2, Math.round((zNow + 0.15) * 100) / 100);
  else if (a === 'zfit') zoom = null;
  else if (a === 'every') every = !every;
  else if (a === 'en') en = !en;
  else if (a === 'toggle') { const id = t.dataset.id; open.has(id) ? open.delete(id) : open.add(id); }
  render();
}
document.addEventListener('click', (e) => { const t = e.target.closest('[data-k],[data-p],[data-f],[data-act]'); if (t) handle(t); });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target.closest && e.target.closest('[data-k],[data-p]');
  if (!t) return;
  e.preventDefault(); handle(t);
});
$('q').addEventListener('input', side);
window.addEventListener('resize', () => { if (zoom === null) render(); });
let start = 0;
try { const h = parseInt(location.hash.slice(1), 10); if (h >= 0 && h < M.stories.length) start = h; } catch (e) {}
load(M.stories[start]);
})();
</script>
