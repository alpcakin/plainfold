# Publishes the browser demo: the view built as static files, opening the saved models in demo/models.
name: Demo

on:
  push:
    branches: [main]
    paths: [app/src/**, app/index.html, app/package*.json, demo/**, docs/screenshots/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the view
        working-directory: app
        run: |
          npm ci
          npm run build -- --base ./ --outDir ../site/app --emptyOutDir
      - name: Add the landing page, models and screenshots
        run: |
          cp demo/index.html site/
          cp -r demo/models site/models
          cp -r docs/screenshots site/screenshots
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
